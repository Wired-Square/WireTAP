name: Build

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" > /dev/null 2>&1 && exit 0
          gh release create "${{ github.ref_name }}" \
            --draft \
            --title "WireTAP ${{ github.ref_name }}" \
            --notes "See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."

  build:
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS_arm64
          - platform: macos-latest
            target: x86_64-apple-darwin
            label: macOS_x64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: Linux_x64
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            label: Linux_arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows_x64

    runs-on: ${{ matrix.platform }}
    env:
      CARGO_REGISTRIES_WIRED_SQUARE_MIRROR_TOKEN: ${{ secrets.CARGO_REGISTRIES_WIRED_SQUARE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read the wslib crates from the registry mirror
        shell: bash
        run: cat .cargo/mirror.toml >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.99
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Import Apple certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE: ${{ secrets.APPLE_INSTALLER_CERTIFICATE }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERT_PATH
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          if [ -n "$APPLE_INSTALLER_CERTIFICATE" ]; then
            echo -n "$APPLE_INSTALLER_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/installer.p12
            security import $RUNNER_TEMP/installer.p12 -P "$APPLE_INSTALLER_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          fi
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

      - name: Set notarisation credentials
        if: runner.os == 'macOS' && vars.APPLE_NOTARISE == 'true'
        run: |
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> $GITHUB_ENV
          echo "APPLE_PASSWORD=${{ secrets.APPLE_NOTARY_PASSWORD }}" >> $GITHUB_ENV
          echo "APPLE_TEAM_ID=${{ vars.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - name: Build wiretap-can-cli sidecar
        run: bash scripts/build-can-cli-sidecar.sh ${{ matrix.target }}
        shell: bash

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          TAURI_APP_PATH: ${{ github.workspace }}/crates/wiretap-app
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/frontend/wiretap-ui
        with:
          args: --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '' }} --config ${{ github.workspace }}/crates/wiretap-app/tauri.can-cli.conf.json
          # Release is pre-created by create-release job; tauri-action finds it and uploads assets.
          # macOS ships only the pkg, which a later step uploads.
          tagName: ${{ github.ref_name }}
          assetNamePattern: WireTAP_[version]_${{ matrix.label }}[ext]
          releaseDraft: true
          prerelease: false
        if: runner.os != 'macOS'

      - name: Build Tauri app (macOS, uploaded as a pkg below)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          TAURI_APP_PATH: ${{ github.workspace }}/crates/wiretap-app
          TAURI_FRONTEND_PATH: ${{ github.workspace }}/frontend/wiretap-ui
        with:
          args: --target ${{ matrix.target }} ${{ runner.os == 'macOS' && '--bundles app' || '' }} --config ${{ github.workspace }}/crates/wiretap-app/tauri.can-cli.conf.json
        if: runner.os == 'macOS'

      - name: Build macOS installer package
        if: runner.os == 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=target/${{ matrix.target }}/release/bundle
          app=$bundle/macos/WireTAP.app
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          pkg=$bundle/pkg/WireTAP_${version}_${{ matrix.label }}.pkg
          mkdir -p "$bundle/pkg"
          export APPLE_INSTALLER_IDENTITY=$(security find-identity -v | sed -n 's/.*"\(Developer ID Installer: .*\)"/\1/p' | head -1)
          bash scripts/macos-pkg.sh "$app" "$pkg"
          if [ -n "$APPLE_INSTALLER_IDENTITY" ] && [ -n "${APPLE_ID:-}" ]; then
            xcrun notarytool submit "$pkg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$pkg"
          fi
          gh release upload "${{ github.ref_name }}" "$pkg" --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: wiretap-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
