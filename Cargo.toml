wslib-can-slcan = { path = "../wslib-rs-wiretap-d/crates/wslib-can-slcan" }
wslib-checksum = { path = "../wslib-rs-wiretap-d/crates/wslib-checksum" }
wslib-serial = { path = "../wslib-rs-wiretap-d/crates/wslib-serial" }
wslib-tcp = { path = "../wslib-rs-wiretap-d/crates/wslib-tcp" }
