[package]
name = "wiretap"
version = "0.9.1"
description = "Desktop UI for WireTAP. CAN bus analysis and decoding toolkit."
authors = ["Alex Ferrara"]
edition = "2021"
default-run = "WireTAP"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "WireTAP"
path = "src/main.rs"

[[bin]]
name = "gs_usb_cli"
path = "../tools/gs_usb_cli/main.rs"
required-features = ["cli"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "wiretap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# time 0.3.48 breaks cookie 0.18.1 (E0119 blanket-From collision, via tauri);
# cookie has no fixed release yet. Drop this pin once cookie > 0.18.1 lands.
time = "=0.3.47"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
# Keyring has no default features - must specify platform backends explicitly
keyring = { version = "3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
tokio = { version = "1", features = ["net", "io-util", "macros", "sync", "time", "process"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
once_cell = "1"
hex = "0.4"
# Catalogue sharing: sha1 computes git blob hashes locally, so "is my copy
# committed?" is answered without a network round trip.
sha1 = "0.10"
# Catalogue sharing transport: a real libgit2 clone per saved repository, so pull
# is a fetch and push is a commit plus push rather than an emulation of them over
# the GitHub contents API. Vendored so no libgit2 is required on the build host.
# `ssh` is deliberately off: HTTPS with the keychain token covers every supported
# host today, and libssh2 is build weight we would carry to four platforms for
# nothing. See docs/catalog-sharing.md.
#
# TLS backend is chosen by libgit2-sys per target: SecureTransport on Apple, WinHTTP
# on Windows, OpenSSL on other unixes. Only Linux actually calls OpenSSL — see the
# per-target overrides below for why the Apple targets still have to carry it.
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2"] }
chrono = "0.4"
async-trait = "0.1"
toml = "0.8"
can-dbc = "8"
reqwest = { version = "0.12", features = ["json"] }
# Backend-side Sentry client for anonymous usage-analytics *logs* — sends over
# native HTTPS (no webview CSP). Logs-only; crash reporting stays in the
# frontend @sentry/react SDK. Needs >= 0.42 for structured logs.
sentry = { version = "0.42", features = ["logs"] }
rumqttc = "0.24"
# MCP server — exposes live runtime state to an external MCP client over a
# localhost streamable-HTTP transport (opt-in via settings). axum hosts the
# transport; tokio-util provides the graceful-shutdown token.
# 3.x implements MCP 2026-07-28 while still answering the 2025-11-25 handshake.
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1"
tokio-util = "0.7"
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }
tokio-tungstenite = "0.26"
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# BLE scanning, mDNS discovery, the WiFi-prov GATT service, and the SMP
# transports for firmware upgrade are all provided by framelink (which
# vendors btleplug 0.12, mdns-sd, and mcumgr-smp internally — we don't
# depend on any of them directly any more).
framelink = { git = "ssh://git@github.com/Wired-Square/framelink-rs.git", branch = "main", features = ["discovery", "ble", "wifi-prov", "smp"] }
# Canonical WireTAP catalogue library — parse/validate/decode/encode + DBC for
# CAN, Serial and Modbus; shared with the ESS add-on. Pinned by tag; a local
# `.cargo/config.toml` paths override points at a sibling checkout for the dev
# loop (same pattern as framelink).
wiretap-catalog = { git = "ssh://git@github.com/Wired-Square/wiretap-lib-rs.git", tag = "v0.8.3" }
# Desktop-only dependencies (serial/USB/keepawake not available on iOS)
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
serialport = "4.3"
keepawake = "0.5"
# Firmware flashers — drive the ESP32 serial bootloader (esptool-style) and
# STM32 USB DFU 1.1 / DfuSe protocols. Used by the Serial app's flash tabs.
espflash = { version = "4", default-features = false, features = ["serialport"] }
dfu-core = "0.10"
dfu-nusb = "0.1"
# `dfu-nusb` 0.1 pins nusb 0.1; gs_usb uses nusb 0.2's MaybeFuture API.
# Both versions coexist — alias the 0.1 copy for DFU code only.
nusb_dfu = { package = "nusb", version = "0.1" }
# Intel HEX parsing for the STM32 UART flasher.
ihex = "3"
# Filesystem watcher for the decoder directory — keeps the backend-owned
# catalogue cache fresh when .toml files are added/edited outside the app.
notify = "6"

# MacOS
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
nusb = { version = "0.2", features = ["tokio"] }
# Same dead-weight OpenSSL as iOS, and for the same reason — see the iOS block. macOS
# does not *fail* without this (openssl-sys finds a system OpenSSL it then ignores),
# but that makes the build depend on the host having a discoverable OpenSSL for a
# library libgit2 never calls. Homebrew's openssl@3 is keg-only, so that discovery is
# exactly the kind of thing that works on a dev machine and fails on a CI runner.
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

# iOS
[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# libgit2 uses SecureTransport on every Apple target (libgit2-sys picks the backend
# on `target.contains("apple")`), so OpenSSL is never called here. It is vendored
# anyway because libgit2-sys declares openssl-sys under a blanket `cfg(unix)`, which
# catches iOS: without this, openssl-sys's build script hunts for a host OpenSSL via
# pkg-config and fails the cross-compile outright. Dead weight — nothing references
# the symbols, so the linker drops them — but the alternative is no iOS build.
#
# The real fix belongs upstream: that cfg should be `all(unix, not(target_vendor =
# "apple"))`. Drop both Apple `vendored-openssl` overrides if libgit2-sys narrows it.
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
tauri-plugin-keep-screen-on = "0.1"
tauri-plugin-safe-area-insets-css = "0.1"

# Windows
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
nusb = { version = "0.2", features = ["tokio"] }
windows-sys = { version = "0.59", features = ["Win32_UI_HiDpi", "Win32_Foundation"] }

[features]
cli = ["clap"]

[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

# Linux
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = "3.3"
# sync-secret-service uses DBus Secret Service (GNOME Keyring, KWallet)
keyring = { version = "3", features = ["sync-secret-service"] }
# libgit2 talks HTTPS through OpenSSL on Linux (macOS/iOS use SecureTransport,
# Windows uses WinHTTP, neither of which needs this). Vendored so the deb/rpm/
# AppImage carry their own libssl instead of depending on whatever the build host
# and the user's distro happen to ship.
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
# nusb — used by the STM32 DFU flasher (dfu-nusb). Already a dep on
# macOS/Windows; added here for Linux parity.
nusb = { version = "0.2", features = ["tokio"] }
