[meta]
name = "Discovery \"export\""
version = 2
default_frame = "can"

[meta.can]
default_byte_order = "big"
default_interval = 100

[frame.can."0x100"]
length = 8
notes = [
    "seen at 10 Hz",
    "rolls over at 0xFFFF",
]
interval = 50

[[frame.can."0x100".signals]]
name = "rpm"
start_bit = 16
bit_length = 16
byte_order = "little"
# Source: user, confidence: high
[[frame.can."0x100".signals]]
name = "sensor_4_5"
start_bit = 32
bit_length = 16
byte_order = "little"
# Source: payload-analysis, confidence: medium
[[frame.can."0x100".signals]]
name = "data_0"
start_bit = 0
bit_length = 16
format = "hex"
[[frame.can."0x100".signals]]
name = "data_6"
start_bit = 48
bit_length = 16
format = "hex"

[frame.can."0x200"]
length = 8

# Multiplexed frame (selector at byte 0)
[frame.can."0x200".mux]
start_bit = 0
bit_length = 8
# Mux cases: 0x1, 0x2

[frame.can."0x200".mux."1"]
[[frame.can."0x200".mux."1".signals]]
name = "speed_kph"
start_bit = 16
bit_length = 16
# Source: user, confidence: medium
[[frame.can."0x200".mux."1".signals]]
name = "counter_4_5"
start_bit = 32
bit_length = 16
# Source: payload-analysis, confidence: high
[[frame.can."0x200".mux."1".signals]]
name = "data_1"
start_bit = 8
bit_length = 8
format = "hex"
[[frame.can."0x200".mux."1".signals]]
name = "data_6"
start_bit = 48
bit_length = 16
format = "hex"

[frame.can."0x200".mux."2"]
[[frame.can."0x200".mux."2".signals]]
name = "data_1"
start_bit = 8
bit_length = 56
format = "hex"

[frame.can."0x300"]
length = 8

# 2D Multiplexed frame (selector at byte[0:1])
[frame.can."0x300".mux]
start_bit = 0
bit_length = 8
# Outer mux cases (byte 0): 1, 2

[frame.can."0x300".mux."1".mux]
start_bit = 8
bit_length = 8
# Inner mux cases (byte 1): 2, 3
[[frame.can."0x300".mux."1".mux."2".signals]]
name = "data_2"
start_bit = 16
bit_length = 48
format = "hex"
[[frame.can."0x300".mux."1".mux."3".signals]]
name = "data_2"
start_bit = 16
bit_length = 48
format = "hex"

[frame.can."0x300".mux."2".mux]
start_bit = 8
bit_length = 8
# Inner mux cases (byte 1): 1
[[frame.can."0x300".mux."2".mux."1".signals]]
name = "data_2"
start_bit = 16
bit_length = 48
format = "hex"

[frame.can."0x18FF0001"]
length = 4

[[frame.can."0x18FF0001".signals]]
name = "data_0"
start_bit = 0
bit_length = 32
format = "hex"
